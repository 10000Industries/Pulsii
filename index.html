<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pulsii</title>
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A shared live canvas of fading colour pulses.">
  <!-- PULSII_PUBLIC_META -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Full-screen drawing surface -->
  <canvas id="canvas"></canvas>

  <!-- Continuous colour selector (native colour input gives a hue wheel in most browsers) -->
  <input id="color-picker" type="color" aria-label="Pulse colour">
  <div id="color-handle" role="button" tabindex="0" aria-label="Choose pulse colour"></div>

  <div id="connection-status" role="status" hidden></div>
  <!-- Buy Me a Coffee prompt (hidden by default) -->
  <div id="coffee-card" aria-live="polite">
    <button id="coffee-close" aria-label="Close support prompt">×</button>
    <p>Enjoying Pulsii?</p>
    <a href="/privacy">Privacy and contact</a>
    <button id="coffee-button">Buy me a coffee</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
